project:
  type: website
  render:
    - "*.qmd"
    - "*.md"
    - "blog/**/*.qmd"
    - "talk/**/*.qmd"
    - "project/**/*.qmd"
    - "about/index.*md"
  preview: 
    browser: true
  #output-dir: docs


website:
  title: "SARA Institute"
  favicon: "images/logo-sara.png"
  site-url: "https://sara-edu.netlify.app/"
  description: "SARA is a non-profit institute brining free, open-source & inclusive data science education to first-generation learners across India."
  twitter-card: 
    creator: "@sara_institute"
    site: "@sara_institute"
    card-style: summary_large_image
    image: social-default.png
  cookie-consent: false
  # announcement:
    #icon: book
    # dismissable: true
    # content: "🚀 Applications Open for 3rd Summer School Jul 2026 [Registration Link](https://forms.gle/PoxbuymTz9XL28667)"
    # type: success
    # position: below-navbar
  
  
  navbar:
    search: true
    pinned: true
    right:
      - text: About
        menu: 
          - text: Mission  
            href: about.qmd  
          - text: News
            href: news.qmd
          - text: Donate 
            href: donate.qmd
          # - text: Timeline
          #   href: timeline.qmd
          # - text: Annual Report
          #   href: annual-report.qmd  
        # - text: Contact
        #   href: contact.qmd
      - text: Data Schools 
        menu:
          - text: Summer School
            href: summer.qmd
          - text: Winter School
            href: winter.qmd
          - text: March Bootcamp
            href: bootcamp.qmd      
      - text: Online Classes
        href: online.qmd
      - text: Book Club
        href: book-club.qmd
      - text: Collaborations
